name: TestFlight

# Archives Stitch, exports it and puts the build on TestFlight — for both
# platforms, because the App Store record is one multiplatform listing.
#
# A tag push uploads; a manual run uploads unless you untick the box, so a run
# can also just prove that signing works.
#
# project.yml signs ad-hoc ("-") so that local builds need no team. This
# workflow overrides that with the team and automatic signing, because only a
# real certificate can produce an App Store build.
#
# Four repository secrets are documented in docs/TESTFLIGHT.md; no certificate is
# stored anywhere, the runner signs from the API key.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after archiving
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APP_CONNECT_KEY_ID: ${{ secrets.APP_CONNECT_KEY_ID }}
  APP_CONNECT_ISSUER_ID: ${{ secrets.APP_CONNECT_ISSUER_ID }}
  SHOULD_UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}

jobs:
  ios:
    name: iOS build & upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the signing secrets exist
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID APP_CONNECT_KEY_ID APP_CONNECT_ISSUER_ID \
                      APP_CONNECT_KEY_P8; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing - see docs/TESTFLIGHT.md"
            exit 1
          fi
          echo "the four API-key secrets are present"

      - name: Write the App Store Connect key
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "$APP_CONNECT_KEY_P8" | base64 --decode > "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project Stitch.xcodeproj -scheme Stitch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Stitch-iOS.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export the ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Stitch-iOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist AppStore/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}"

      - name: Upload to TestFlight
        if: ${{ env.SHOULD_UPLOAD == 'true' }}
        run: |
          set -euo pipefail
          ipa=$(ls build/export/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "${APP_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_CONNECT_ISSUER_ID}" \
            --apiKeyPath "$PWD/private_keys"

      - name: Keep the ipa
        uses: actions/upload-artifact@v4
        with:
          name: Stitch-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build & upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the signing secrets exist
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID APP_CONNECT_KEY_ID APP_CONNECT_ISSUER_ID \
                      APP_CONNECT_KEY_P8; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing - see docs/TESTFLIGHT.md"
            exit 1
          fi
          echo "the four API-key secrets are present"

      - name: Write the App Store Connect key
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "$APP_CONNECT_KEY_P8" | base64 --decode > "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project Stitch.xcodeproj -scheme Stitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Stitch-macOS.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export the pkg
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Stitch-macOS.xcarchive \
            -exportPath build/export-mac \
            -exportOptionsPlist AppStore/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}"

      - name: Upload to TestFlight
        if: ${{ env.SHOULD_UPLOAD == 'true' }}
        run: |
          set -euo pipefail
          pkg=$(ls build/export-mac/*.pkg)
          xcrun altool --upload-app --type macos --file "$pkg" \
            --apiKey "${APP_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_CONNECT_ISSUER_ID}" \
            --apiKeyPath "$PWD/private_keys"

      - name: Keep the pkg
        uses: actions/upload-artifact@v4
        with:
          name: Stitch-pkg
          path: build/export-mac/*.pkg
          if-no-files-found: error
          retention-days: 14
